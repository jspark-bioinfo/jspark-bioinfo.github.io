tagline: >-
  I develop network and quantum algorithms for drug discovery.

profile: >-
  I develop computational methods for biology rather than only applying them.
  My work starts from a simple premise: disease arises from perturbations that
  spread through molecular networks, and the algorithms we use to trace that
  spread determine what we can discover. This is why nearly all of my
  publications introduce new methods, spanning network propagation, graph
  embedding, network visualisation and machine learning, and applied to problems
  from drug combinations and adverse drug reactions to inflammatory bowel
  disease and Long COVID.

profile2: >-
  I now work on bringing quantum algorithms to network biology, and my ambition
  is to demonstrate quantum advantage in the life sciences, starting with drug
  discovery. Biological networks are where that advantage is most likely to
  appear first: they are large, sparse and highly structured, and dominated by
  propagation and search problems for which quantum algorithms have known
  theoretical advantages. My first quantum walk methods have already revealed
  disease mechanisms in Long COVID that classical random walks missed. I am now
  building the theory and the experimental validation, in patient-derived
  organoids, needed to turn results like these into a demonstrable quantum
  advantage in therapeutic target discovery.

research_fields:
  - Network Biology
  - Quantum Algorithms
  - Method Development
  - Multi-omics Integration
  - Drug Target Discovery

